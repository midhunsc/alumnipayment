<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure UPI Payment</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            margin:0;
            padding:0;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }
        .box{
            background:#fff;
            width:90%;
            max-width:420px;
            padding:25px;
            border-radius:18px;
            box-shadow:0 8px 25px rgba(0,0,0,0.12);
            text-align:center;
        }
        h2{margin-bottom:8px;}
        p{color:#666;font-size:14px;}
        input{
            width:90%;
            padding:12px;
            margin:15px 0;
            border:1px solid #ccc;
            border-radius:10px;
            font-size:16px;
            text-align:center;
        }
        button{
            width:100%;
            padding:14px;
            margin:8px 0;
            border:none;
            border-radius:10px;
            font-size:16px;
            cursor:pointer;
        }
        .qr{
            margin-top:20px;
        }
        img{
            width:180px;
            height:180px;
        }
        .copy{
            background:#eee;
            padding:10px;
            border-radius:8px;
            margin-top:12px;
            font-size:13px;
            word-break:break-all;
        }
    </style>
</head>
<body><div class="box">
    <h2>UPI Payment Gateway</h2>
    <p>Enter amount and choose any UPI app</p><input type="number" id="amt" placeholder="Enter Amount">

<button onclick="openGpay()">Pay with Google Pay</button>
<button onclick="openPhonePe()">Pay with PhonePe</button>
<button onclick="openPaytm()">Pay with Paytm</button>

<div class="qr">
    <p>Or Scan QR</p>
    <img id="qrimg" src="" alt="QR Code">
</div>

<div class="copy" onclick="copyUpi()">
    QR919495318552-0168@unionbankofindia<br>
    Tap to Copy UPI ID
</div>

</div><script>
const upiId = "QR919495318552-0168@unionbankofindia";
const payee = "Union Bank QR";

function buildLink(){
    let amount = document.getElementById('amt').value;
    let txn = 'TXN' + Date.now();
    let link = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(payee)}&mc=5411&tr=${txn}&tn=Payment&cu=INR`;
    if(amount && amount > 0){
        link += `&am=${amount}`;
    }
    return link;
}

function openGpay(){
    let l = buildLink().replace('upi://','');
    window.location.href=`intent://${l}#Intent;scheme=upi;package=com.google.android.apps.nbu.paisa.user;end`;
}

function openPhonePe(){
    let l = buildLink().replace('upi://','');
    window.location.href=`intent://${l}#Intent;scheme=upi;package=com.phonepe.app;end`;
}

function openPaytm(){
    let l = buildLink().replace('upi://','');
    window.location.href=`intent://${l}#Intent;scheme=upi;package=net.one97.paytm;end`;
}

function copyUpi(){
    navigator.clipboard.writeText(upiId);
    alert('UPI ID Copied');
}

function generateQR(){
    let qr = encodeURIComponent(buildLink());
    document.getElementById('qrimg').src = `https://quickchart.io/qr?text=${qr}&size=200`;
}

generateQR();
document.getElementById('amt').addEventListener('input', generateQR);
</script></body>
</html>
