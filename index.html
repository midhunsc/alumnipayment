<!DOCTYPE html>
<html>
<head>
    <title>UPI Payment</title>
</head>
<body>

    <button onclick="payNow()">Pay Now</button>

    <div id="fallback" style="display:none;">
        If app did not open, scan QR or copy UPI ID
    </div>

    <script>
        function payNow() {
            window.location.href="intent://pay?pa=QR919495318552-0168@unionbankofindia&pn=Union%20Bank%20QR&mc=5411&tr=TXN91949531855201&tn=Merchant%20Payment&cu=INR#Intent;scheme=upi;end";

            setTimeout(function(){
                document.getElementById("fallback").style.display="block";
            },1500);
        }
    </script>

</body>
</html>
